{% set name = "pyMapVBVD" %}
{% set version = "0.7.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/f4/1e/7d486300647b8e07da219ee8c0ae949be091d840bde9f1b0e9f503f39ed0/pymapvbvd-{{ version }}.tar.gz
  sha256: 4a5b436bb8c60781fdae5e7529179b5846ab7519297ecd2242481c52fb1d8446

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python >=3.9
    - pip
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - numpy >=1.26
    - tqdm
    - scipy >=1.13
    - six
    - matplotlib-base
    - h5py
test:
  requires:
    - python {{ python_min }}
  imports:
    - mapvbvd

about:
  home: https://github.com/wexeee/pymapvbvd
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python port of mapVBVD.
  description: |
    Python port of mapVBVD.
  doc_url: https://github.com/wexeee/pymapvbvd
  dev_url: https://github.com/wexeee/pymapvbvd

extra:
  recipe-maintainers:
    - vkarlaftis
    - wtclarke
